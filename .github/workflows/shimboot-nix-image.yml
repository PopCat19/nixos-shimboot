# shimboot-nix-image.yml
#
# Purpose: Build complete shimboot disk image via pure Nix derivation
#
# This module:
# - Builds shimboot-image-<board> via nix build (no sudo, no losetup)
# - Supports multi-board matrix builds
# - Pushes built derivations to Cachix
# - Artifacts compressed disk image + checksum

name: shimboot-nix-image

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Target Board'
        required: true
        default: 'dedede'
        type: choice
        options: [all, dedede, octopus, zork, nissa, hatch, grunt, snappy]
      headless:
        description: 'Build headless variant'
        required: false
        default: false
        type: boolean
      push_to_cachix:
        description: 'Push derivations to Cachix'
        required: false
        default: true
        type: boolean
      include_checksum:
        description: 'Generate SHA256 checksum'
        required: false
        default: true
        type: boolean

env:
  NIXPKGS_ALLOW_UNFREE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        board: >-
          ${{
            github.event.inputs.board == 'all'
            && fromJSON('["dedede", "octopus", "zork", "nissa", "hatch", "grunt", "snappy"]')
            || fromJSON(format('["{0}"]', github.event.inputs.board))
          }}

    steps:
      - name: Maximize build space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim disk space for Nix
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'cleave'

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            auto-optimise-store = true
            # Allow FUSE for guestmount (store optimization + git clone)
            allowed-filesystems = fuse
            substituters = https://cache.nixos.org https://shimboot-systemd-nixos.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= shimboot-systemd-nixos.cachix.org-1:vCWmEtJq7hA2UOLN0s3njnGs9/EuX06kD7qOJMo2kAA=

      - name: Setup Cachix
        if: ${{ github.event.inputs.push_to_cachix == 'true' }}
        uses: cachix/cachix-action@v14
        with:
          name: shimboot-systemd-nixos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true

      - name: Build shimboot image (Nix derivation)
        id: build
        run: |
          set -o pipefail
          BOARD="${{ matrix.board }}"
          HEADLESS="${{ github.event.inputs.headless }}"

          if [ "$HEADLESS" = "true" ]; then
            ATTR="shimboot-image-${BOARD}-headless"
          else
            ATTR="shimboot-image-${BOARD}"
          fi

          echo "Building: .#${ATTR}"
          echo "attr=${ATTR}" >> "$GITHUB_OUTPUT"

          success=false
          for i in {1..3}; do
            echo "[Attempt $i/3] nix build .#${ATTR}"
            if nix build --impure --accept-flake-config \
              ".#${ATTR}" --print-out-paths | tee /tmp/image-store-path; then
              success=true
              break
            fi
            echo "[Attempt $i/3] Failed. Retrying in 10s..."
            sleep 10
          done

          if [ "$success" = "false" ]; then
            echo "Image build failed after 3 attempts."
            exit 1
          fi

          IMAGE_PATH="$(cat /tmp/image-store-path)"
          echo "image_path=${IMAGE_PATH}" >> "$GITHUB_OUTPUT"
          ls -lh "$IMAGE_PATH/"

      - name: Push to Cachix
        if: ${{ github.event.inputs.push_to_cachix == 'true' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          IMAGE_PATH="${{ steps.build.outputs.image_path }}"
          echo "Pushing shimboot image closure to Cachix..."
          nix path-info --recursive "$IMAGE_PATH" \
            | cachix push shimboot-systemd-nixos

      - name: Compress and artifact
        run: |
          set -e
          IMAGE_PATH="${{ steps.build.outputs.image_path }}"
          BOARD="${{ matrix.board }}"
          HEADLESS="${{ github.event.inputs.headless }}"

          IMAGE_FILE="$(ls "$IMAGE_PATH"/shimboot.img 2>/dev/null || ls "$IMAGE_PATH"/*.img 2>/dev/null | head -1)"
          if [ -z "$IMAGE_FILE" ]; then
            echo "No .img file found in $IMAGE_PATH"
            ls -laR "$IMAGE_PATH"
            exit 1
          fi

          HEADLESS_SUFFIX=""
          [ "$HEADLESS" = "true" ] && HEADLESS_SUFFIX="-headless"
          ARTIFACT_BASE="${BOARD}-shimboot-nix${HEADLESS_SUFFIX}"

          echo "Compressing $(basename "$IMAGE_FILE") → ${ARTIFACT_BASE}.img.zst"
          stdbuf -oL pv "$IMAGE_FILE" | stdbuf -oL zstd -15 --long -T0 -o "${ARTIFACT_BASE}.img.zst"

          if [ "${{ github.event.inputs.include_checksum }}" = "true" ]; then
            sha256sum "${ARTIFACT_BASE}.img.zst" > "${ARTIFACT_BASE}.img.zst.sha256"
          fi

          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts/${BOARD}"
          mkdir -p "$ARTIFACT_DIR"
          mv "${ARTIFACT_BASE}.img.zst"* "$ARTIFACT_DIR/"

          echo "Artifact ready: $(du -sh "$ARTIFACT_DIR")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-shimboot-nix${{ github.event.inputs.headless == 'true' && '-headless' || '' }}
          path: artifacts/${{ matrix.board }}/*
